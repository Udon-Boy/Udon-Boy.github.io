<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語ルーレットゲーム</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121213; /* ダークモード風 */
            color: white;
        }

        /* タイルが並ぶエリア */
        .board {
            display: flex;
            gap: 10px;
            margin-top: 50px;
        }

        /* 1文字分のタイル */
        .tile {
            width: 60px;
            height: 60px;
            border: 2px solid #3a3a3c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* 状態別の色設定 */
        .correct { background-color: #6aaa64; border-color: #6aaa64; color: white; } /* 緑 */
        .present { background-color: #c9b458; border-color: #c9b458; color: white; } /* 黄 */
        .absent  { background-color: #3a3a3c; border-color: #3a3a3c; color: white; } /* グレー */

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Word Roulette</h1>
    
    <div class="board">
        <div id="t0" class="tile">A</div>
        <div id="t1" class="tile">A</div>
        <div id="t2" class="tile">A</div>
        <div id="t3" class="tile">A</div>
        <div id="t4" class="tile">A</div>
    </div>

    <button id="action-btn">ストップ！</button>

    <script>
        const words = ["APPLE", "LEMON", "GRAPE", "PEACH", "MELON", "SMART", "DREAM"];
let answer = words[Math.floor(Math.random() * words.length)];
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let tileIndex = 0;      // 現在止めるタイル
let letterIndex = 0;    // 現在の文字
let attemptCount = 0;   // 合計クリック数
let intervalId;

// 1. ルーレットを開始する
function startRoulette() {
    intervalId = setInterval(() => {
        if (tileIndex < 5) {
            const currentTile = document.getElementById("t" + tileIndex);
            letterIndex = (letterIndex + 1) % letters.length;
            currentTile.textContent = letters[letterIndex];
        }
    }, 190); 
}

// 2. ボタンをクリックした時の処理
document.getElementById("action-btn").addEventListener("click", () => {
    if (tileIndex < 5) {
        attemptCount++;
        const currentTile = document.getElementById("t" + tileIndex);
        
        // 枠を白くして「確定した」感を出す
        currentTile.style.borderColor = "#ffffff";
        
        tileIndex++;
        letterIndex = 0; 

        // 5文字すべて止まったら
        if (tileIndex === 5) {
            clearInterval(intervalId); // ルーレット停止
            document.getElementById("action-btn").disabled = true; // 連打禁止
            startSequentialCheck(); // ★順番に判定へ
        }
    }
});

// 3. 【判定】1文字ずつ順番に色を変えていく
function startSequentialCheck() {
    let checkIdx = 0;

    const timer = setInterval(() => {
        const tile = document.getElementById("t" + checkIdx);
        const guessedLetter = tile.textContent;

        // 色の判定
        if (guessedLetter === answer[checkIdx]) {
            tile.className = "tile correct"; // 緑
        } else if (answer.includes(guessedLetter)) {
            tile.className = "tile present"; // 黄
        } else {
            tile.className = "tile absent";  // グレー
        }

        checkIdx++;

        if (checkIdx === 5) {
            clearInterval(timer);
            // 全部塗り終わったら、一呼吸おいて最終結果へ
            setTimeout(handleGameEnd, 1000);
        }
    }, 600); // 0.6秒ごとに次の色へ
}

// 4. 【最終判断】クリアか、最初からやり直しか
function handleGameEnd() {
    const allCorrect = Array.from(document.querySelectorAll('.tile'))
                            .every(t => t.classList.contains('correct'));

    if (allCorrect) {
        showGameClear();
    } else {
        const btn = document.getElementById("action-btn");
        btn.textContent = "残念！やり直し";

        setTimeout(() => {
            resetTiles();
            tileIndex = 0; 
            letterIndex = 0;
            btn.disabled = false;
            btn.textContent = "ストップ！";
            startRoulette(); // またルーレットを回す
        }, 2000); 
    }
}

// タイルを初期状態に戻す
function resetTiles() {
    for (let i = 0; i < 5; i++) {
        const tile = document.getElementById("t" + i);
        tile.className = "tile";
        tile.textContent = "A";
        tile.style.borderColor = "#3a3a3c";
    }
}

// ゲームクリア画面を表示
function showGameClear() {
    const btn = document.getElementById("action-btn");
    btn.style.display = "none";
    
    const message = document.createElement("div");
    message.style.marginTop = "20px";
    message.innerHTML = `
        <h2 style="color: #6aaa64;">🎉 CLEAR!</h2>
        <p>正解は <strong>${answer}</strong> でした！</p>
        <p>合計クリック数: <strong>${attemptCount}回</strong></p>
        <button onclick="location.href='../index.html'" style="padding:10px;">トップへ戻る</button>
        <button onclick="location.reload()" style="margin-left:10px; padding:10px;">もう一度</button>
    `;
    document.body.appendChild(message);
}

// 起動！
startRoulette();
    </script>
</body>
</html>
